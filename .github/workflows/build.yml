name: Build
on:
  push:
    tags:
      - 'pcl-v*'
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: pwsh
      run: |
        $describe = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { git describe --tags --always }
        "describe=$describe" >> $env:GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      shell: pwsh
      env:
        PCL_BUILD_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        PCL_BUILD_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        PCL_BUILD_COMMIT: ${{ github.sha }}
        PCL_BUILD_SERVER_LIST: ${{ vars.PCL_SERVER_LIST }}
        PCL_BUILD_LINK_MOD_LIST: ${{ vars.PCL_LINK_MOD_LIST }}
      run: |
        $secretPath = "Plain Craft Launcher 2\Modules\ModSecret.vb"
        $source = Get-Content -LiteralPath $secretPath -Raw
        $settings = @(
          @{ Name = 'CLIENT_ID'; Variable = 'PCL_MS_CLIENT_ID'; Value = $env:PCL_BUILD_CLIENT_ID },
          @{ Name = 'CURSEFORGE_API_KEY'; Variable = 'PCL_CURSEFORGE_API_KEY'; Value = $env:PCL_BUILD_CURSEFORGE_API_KEY }
        )
        foreach ($setting in $settings) {
          if ([string]::IsNullOrWhiteSpace($setting.Value)) { throw "Missing repository secret: $($setting.Name)" }
          if ($setting.Value -match '[\r\n]') { throw "Repository secret contains a newline: $($setting.Name)" }
          $original = 'If(Environment.GetEnvironmentVariable("' + $setting.Variable + '"), "")'
          if (-not $source.Contains($original)) { throw "Source placeholder not found for $($setting.Name)" }
          $escapedValue = $setting.Value.Replace('"', '""')
          $replacement = 'If(Environment.GetEnvironmentVariable("' + $setting.Variable + '"), "' + $escapedValue + '")'
          $source = $source.Replace($original, $replacement)
        }
        Set-Content -LiteralPath $secretPath -Value $source -Encoding utf8 -NoNewline
        $basePath = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        $baseSource = Get-Content -LiteralPath $basePath -Raw
        $baseSource = $baseSource.Replace('Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "' + $env:PCL_BUILD_COMMIT + '"')
        $serverList = $env:PCL_BUILD_SERVER_LIST
        if ($null -eq $serverList) { $serverList = '' }
        if ($serverList -match '[\r\n]') { throw 'Repository variable PCL_SERVER_LIST must be a single line' }
        if ($serverList.Length -gt 10000) { throw 'Repository variable PCL_SERVER_LIST exceeds 10000 characters' }
        Add-Type -Path "PCLCS\Minecraft\McServerList.cs"
        $validationError = [PCLCS.McServerList]::ValidateConfiguration($serverList)
        if ($validationError) { throw "Invalid repository variable PCL_SERVER_LIST: $validationError" }
        $placeholder = 'Public Const LaunchServerListPreset As String = ""'
        if (-not $baseSource.Contains($placeholder)) { throw 'Source placeholder not found for PCL_SERVER_LIST' }
        $baseSource = $baseSource.Replace($placeholder, 'Public Const LaunchServerListPreset As String = "' + $serverList.Replace('"', '""') + '"')

        $linkModList = [string]$env:PCL_BUILD_LINK_MOD_LIST
        if ($linkModList -match '[\r\n]') { throw 'Repository variable PCL_LINK_MOD_LIST must be a single line' }
        if ($linkModList.Length -gt 4000) { throw 'Repository variable PCL_LINK_MOD_LIST exceeds 4000 characters' }
        $placeholder = 'Public Const LinkModListPresetBase64 As String = ""'
        if (-not $baseSource.Contains($placeholder)) { throw 'Source placeholder not found for PCL_LINK_MOD_LIST' }
        $encodedLinkModList = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($linkModList))
        $baseSource = $baseSource.Replace($placeholder, 'Public Const LinkModListPresetBase64 As String = "' + $encodedLinkModList + '"')
        Set-Content -LiteralPath $basePath -Value $baseSource -Encoding utf8 -NoNewline

    - name: Configure Launcher Update
      if: github.event_name == 'push' && github.repository == 'mqh9007/PCL' && startsWith(github.ref, 'refs/tags/pcl-v') && matrix.configuration == 'Release'
      shell: pwsh
      env:
        PCL_UPDATE_PUBLIC_KEY: ${{ vars.PCL_UPDATE_PUBLIC_KEY }}
      run: |
        $code = 0
        if ($env:GITHUB_REF_NAME -cnotmatch '^pcl-v([1-9][0-9]*)$' -or -not [int]::TryParse($Matches[1], [ref]$code)) {
          throw 'The release tag must be pcl-v followed by a positive 32-bit integer.'
        }
        $key = $env:PCL_UPDATE_PUBLIC_KEY
        if ($key -cnotmatch '^[A-Za-z0-9+/]+={0,2}\.[A-Za-z0-9+/]+={0,2}$') {
          throw 'Set the repository variable PCL_UPDATE_PUBLIC_KEY to the Base64 modulus and exponent separated by a dot.'
        }
        $updatePath = 'Plain Craft Launcher 2\Modules\ModLauncherUpdate.vb'
        $source = Get-Content -LiteralPath $updatePath -Raw
        $codePlaceholder = 'Private Const CurrentUpdateCode As Integer = 0'
        $keyPlaceholder = 'Private Const UpdatePublicKey As String = ""'
        if (-not $source.Contains($codePlaceholder) -or -not $source.Contains($keyPlaceholder)) {
          throw 'Launcher update placeholders were not found.'
        }
        $source = $source.Replace($codePlaceholder, "Private Const CurrentUpdateCode As Integer = $code")
        $source = $source.Replace($keyPlaceholder, ('Private Const UpdatePublicKey As String = "' + $key + '"'))
        Set-Content -LiteralPath $updatePath -Value $source -Encoding utf8 -NoNewline

    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe
        if-no-files-found: error

  publish:
    name: Publish launcher update
    if: github.event_name == 'push' && github.repository == 'mqh9007/PCL' && startsWith(github.ref, 'refs/tags/pcl-v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: pcl-launcher-release
      cancel-in-progress: false
    steps:
      - name: Download Release Build
        uses: actions/download-artifact@v8
        with:
          name: Release ${{ github.ref_name }}
          path: release

      - name: Sign Update Manifest
        shell: pwsh
        env:
          PCL_UPDATE_PUBLIC_KEY: ${{ vars.PCL_UPDATE_PUBLIC_KEY }}
          PCL_UPDATE_SIGNING_KEY: ${{ secrets.PCL_UPDATE_SIGNING_KEY }}
          PCL_UPDATE_CRITICAL: ${{ vars.PCL_UPDATE_CRITICAL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PCL_UPDATE_SIGNING_KEY)) {
            throw 'Set the repository secret PCL_UPDATE_SIGNING_KEY.'
          }
          $exe = Rename-Item -LiteralPath 'release\Plain Craft Launcher 2.exe' -NewName 'PCL.exe' -PassThru
          if ($exe.Length -le 0 -or $exe.Length -gt 100MB) { throw 'The update executable is outside the supported size range.' }
          $releaseCode = [int]$env:GITHUB_REF_NAME.Substring('pcl-v'.Length)
          $versionName = $exe.VersionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($versionName)) { throw 'The update executable has no file version.' }
          $data = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            versionCode = $releaseCode
            versionName = $versionName
            sha256 = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash
            size = $exe.Length
            critical = ($env:PCL_UPDATE_CRITICAL -eq 'true')
          }
          $payload = [Text.Encoding]::UTF8.GetBytes((ConvertTo-Json -InputObject $data -Compress))
          $signer = [Security.Cryptography.RSA]::Create()
          try {
            $keyBytes = [Convert]::FromBase64String($env:PCL_UPDATE_SIGNING_KEY)
            $null = $signer.ImportPkcs8PrivateKey($keyBytes, [ref]$null)
            $parameters = $signer.ExportParameters($false)
            $publicKey = [Convert]::ToBase64String($parameters.Modulus) + '.' + [Convert]::ToBase64String($parameters.Exponent)
            if ($signer.KeySize -lt 2048 -or $publicKey -cne $env:PCL_UPDATE_PUBLIC_KEY) { throw 'The signing key must be at least RSA 2048 and match PCL_UPDATE_PUBLIC_KEY.' }
            $signature = $signer.SignData($payload, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
          } finally {
            $signer.Dispose()
          }
          $manifest = @{
            payload = [Convert]::ToBase64String($payload)
            signature = [Convert]::ToBase64String($signature)
          }
          ConvertTo-Json -InputObject $manifest -Compress | Set-Content -LiteralPath 'release\update.json' -Encoding utf8NoBOM

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $code = [int]$tag.Substring('pcl-v'.Length)
          $releasePages = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pages = ($releasePages -join "`n") | ConvertFrom-Json -NoEnumerate
          $releases = @($pages | ForEach-Object { $_ })
          $existing = $releases | Where-Object { $_.tag_name -ceq $tag } | Select-Object -First 1
          if ($existing -and -not $existing.draft) {
            Write-Host 'This launcher release is already published.'
            exit 0
          }
          foreach ($release in $releases) {
            if (-not $release.draft -and $release.tag_name -cmatch '^pcl-v([1-9][0-9]*)$' -and [long]$Matches[1] -gt $code) {
              throw 'A newer launcher update has already been published.'
            }
          }
          if ($existing) {
            gh release upload $tag release/PCL.exe release/update.json --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --draft=false --prerelease=false --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag release/PCL.exe release/update.json --verify-tag --latest --title "PCL build $code" --generate-notes --repo $env:GITHUB_REPOSITORY
          }
          exit $LASTEXITCODE
